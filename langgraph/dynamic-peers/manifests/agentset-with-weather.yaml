# Travel planner with a weather worker added. Compared with agentset.yaml, only this
# manifest changes: the planner's code and image are identical.
#
# One image runs every agent; --role picks which. The planner's code never
# names a worker: it asks Kynomesh for its peers at startup.
#
# driftReload is on fleet-wide, so when a worker's AgentCard changes Kynomesh
# restarts the planner and it re-reads the card.
#
# Create the secret first (see README):
#   kubectl create secret generic openai-api-key --from-literal=OPENAI_API_KEY=...
apiVersion: kynomesh.kyno.sh/v1alpha1
kind: AgentSet
metadata:
  name: langgraph-travel
spec:
  pattern: Supervisor
  entry: planner
  driftReload:
    enabled: true
  agents:
    - name: planner
      container:
        image: langgraph-travel:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "planner"]
        env: &openai-env
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openai-api-key
                key: OPENAI_API_KEY
    - name: flights
      container:
        image: langgraph-travel:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "flights"]
        env: *openai-env
    - name: hotels
      container:
        image: langgraph-travel:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "hotels"]
        env: *openai-env
    - name: weather
      container:
        image: langgraph-travel:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "weather"]
        env: *openai-env
