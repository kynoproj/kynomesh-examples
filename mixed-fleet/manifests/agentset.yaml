# Travel planner with a mixed fleet: base set.
#
# The planner and `hotels` are Claude Agent SDK agents (image claude-travel);
# `flights` is a LangGraph agent (image langgraph-travel). The planner
# discovers all of them the same way: it only sees AgentCards and A2A endpoints.
#
# Build the images first (make build), then create both secrets (see README):
#   kubectl create secret generic anthropic-api-key --from-literal=ANTHROPIC_API_KEY=...
#   kubectl create secret generic openai-api-key --from-literal=OPENAI_API_KEY=...
apiVersion: kynomesh.kyno.sh/v1alpha1
kind: AgentSet
metadata:
  name: mixed-travel
spec:
  pattern: Supervisor
  entry: planner
  driftReload:
    enabled: true
  agents:
    - name: planner
      container:
        image: claude-travel:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "planner"]
        env:
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: anthropic-api-key
                key: ANTHROPIC_API_KEY
    - name: flights
      container:
        image: langgraph-travel:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "flights"]
        env:
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openai-api-key
                key: OPENAI_API_KEY
    - name: hotels
      container:
        image: claude-travel:latest
        imagePullPolicy: IfNotPresent
        args: ["--role", "hotels"]
        env:
          - name: ANTHROPIC_API_KEY
            valueFrom:
              secretKeyRef:
                name: anthropic-api-key
                key: ANTHROPIC_API_KEY
